services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/mentecart
      REDIS_URL: redis://redis:6379
      PUBLIC_SERVER_URL: http://localhost:4000
      JWT_SECRET: replace-with-a-secure-random-string
      JWT_EXPIRES_IN: 12h
      CLIENT_ORIGIN: "*"
      SLOT_HOLD_MINUTES: 15
      MAX_BOOKINGS_PER_DAY: 3
      CANCELLATION_CUTOFF_HOURS: 6
      HOLD_CLEANUP_INTERVAL_MS: 60000
      PAYHERE_SANDBOX: "true"
      PAYHERE_MERCHANT_ID: ""
      PAYHERE_MERCHANT_SECRET: ""
      PAYHERE_NOTIFY_URL: ""
      PAYHERE_RETURN_URL: ""
      PAYHERE_CANCEL_URL: ""
      PAYHERE_CURRENCY: LKR
      SEED_ON_STARTUP: "true"
      ADMIN_EMAIL: admin@mentecart.local
      ADMIN_PASSWORD: replace-with-a-demo-admin-password
      ADMIN_NAME: Operations Admin
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo-data:
